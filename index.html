<!DOCTYPE html>
<html lang="es" style="background-color: #080c14; color-scheme: dark;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- Meta-tags para PWA en iOS y Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Casa">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#080c14">
    <meta name="color-scheme" content="dark">
    <link rel="apple-touch-icon" href="icon.png">

    <title>Mi Casa App</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Ocupación real del 100% de la pantalla física (sin recortar la parte inferior en iOS PWA) */
        html,
        body {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #080c14;
            color-scheme: dark;
        }

        /* Barra de progreso sutil y elegante entre pantallas */
        #navProgress {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            left: 0;
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg, #0ea5e9, #38bdf8, #10b981);
            z-index: 999;
            opacity: 0;
            transition: width 0.35s ease, opacity 0.2s ease;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }

        /* Iframe ocupa el 100% real del alto disponible hasta el fondo físico */
        iframe {
            position: absolute;
            top: env(safe-area-inset-top, 0px);
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: calc(100% - env(safe-area-inset-top, 0px));
            border: none;
            display: block;
            background-color: #080c14;
            color-scheme: dark;
            transition: opacity 0.25s ease-in-out;
        }

        /* Frame activo visible */
        iframe.active-frame {
            z-index: 20;
            opacity: 1;
        }

        /* Frame entrante que carga por detrás (elimina 100% el flash blanco) */
        iframe.incoming-frame {
            z-index: 10;
            opacity: 1;
        }

        /* Frame saliente que se desvanece suavemente */
        iframe.removing {
            opacity: 0;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>

<body>
    <!-- Barra de progreso de cambio de pantalla -->
    <div id="navProgress"></div>

    <!-- Frame inicial con carga directa de IndexMockup -->
    <iframe
        id="initialFrame"
        class="active-frame"
        allowtransparency="true"
        src="https://script.google.com/macros/s/AKfycbyz2VYabP6abyKzvu4mEIpeeMisN1VV4FNFqH7sCMhhDA1EldzS9sh7fWRiZKXvOVk5Vw/exec?page=IndexMockup"
        title="Presupuesto Casa App"></iframe>

    <script>
        const progressBar = document.getElementById('navProgress');

        function startProgress() {
            if (!progressBar) return;
            progressBar.style.opacity = '1';
            progressBar.style.width = '65%';
        }

        function finishProgress() {
            if (!progressBar) return;
            progressBar.style.width = '100%';
            setTimeout(() => {
                progressBar.style.opacity = '0';
                setTimeout(() => { progressBar.style.width = '0%'; }, 200);
            }, 150);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const iframe = document.getElementById('initialFrame');
            if (iframe) {
                try {
                    const url = new URL(iframe.src);
                    const bridgeUrl = window.location.origin + window.location.pathname;
                    url.searchParams.set('bridgeUrl', bridgeUrl);

                    if (window.location.search) {
                        const params = new URLSearchParams(window.location.search);
                        for (const [key, value] of params.entries()) {
                            url.searchParams.set(key, value);
                        }
                    } else if (!url.searchParams.has('page')) {
                        url.searchParams.set('page', 'IndexMockup');
                    }
                    iframe.src = url.toString();
                } catch (e) {
                    console.error("Invalid iframe URL", e);
                }
            }
        });

        // Cero Flashes Blancos: Carga por detrás y desvanecimiento suave
        let currentTargetIframe = null;

        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'NAVIGATE') {
                const currentIframe = document.querySelector('iframe.active-frame') || document.querySelector('iframe:not(.removing)');
                
                window.history.pushState(null, '', event.data.query);
                startProgress();
                
                const baseUrl = "https://script.google.com/macros/s/AKfycbyz2VYabP6abyKzvu4mEIpeeMisN1VV4FNFqH7sCMhhDA1EldzS9sh7fWRiZKXvOVk5Vw/exec";
                const bridgeUrl = window.location.origin + window.location.pathname;
                
                // Carga por DETRÁS con z-index 10 mientras el actual (z-index 20) sigue visible
                const newIframe = document.createElement('iframe');
                newIframe.className = 'incoming-frame';
                newIframe.setAttribute('allowtransparency', 'true');
                newIframe.src = baseUrl + event.data.query + "&bridgeUrl=" + encodeURIComponent(bridgeUrl);
                currentTargetIframe = newIframe;

                let transitioned = false;
                function doTransition() {
                    if (transitioned) return;
                    transitioned = true;
                    finishProgress();

                    setTimeout(() => {
                        newIframe.classList.remove('incoming-frame');
                        newIframe.classList.add('active-frame');
                        
                        if (currentIframe && currentIframe !== newIframe) {
                            currentIframe.classList.add('removing');
                            setTimeout(() => {
                                if (currentIframe.parentNode) currentIframe.remove();
                            }, 300);
                        }
                    }, 120);
                }

                // Espera señal PAGE_READY o fallback
                const onReady = function(e) {
                    if (e.data && e.data.type === 'PAGE_READY') {
                        window.removeEventListener('message', onReady);
                        doTransition();
                    }
                };
                window.addEventListener('message', onReady);

                newIframe.onload = () => {
                    setTimeout(doTransition, 220);
                };

                document.body.insertBefore(newIframe, currentIframe || null);
            }
        });
    </script>
</body>

</html>
