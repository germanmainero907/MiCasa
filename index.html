<!DOCTYPE html>
<html lang="es" style="background-color: #0f172a; color-scheme: dark;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- Meta-tags para PWA en iOS y Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Casa">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <meta name="color-scheme" content="dark">
    <link rel="apple-touch-icon" href="icon.png">

    <title>Mi Casa App</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            color-scheme: dark;
        }

        /* Iframe empieza debajo de la barra de estado, llega hasta el fondo */
        iframe {
            position: absolute;
            top: env(safe-area-inset-top);
            left: 0;
            right: 0;
            bottom: 0;
            border: none;
            display: block;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            z-index: 10;
        }

        iframe.loaded {
            opacity: 1;
        }
    </style>
</head>

<body>
    <iframe
        src="https://script.google.com/macros/s/AKfycbyz2VYabP6abyKzvu4mEIpeeMisN1VV4FNFqH7sCMhhDA1EldzS9sh7fWRiZKXvOVk5Vw/exec"
        title="Presupuesto Casa App"
        onload="this.classList.add('loaded')"></iframe>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const iframe = document.querySelector('iframe');
            if (iframe) {
                try {
                    const url = new URL(iframe.src);
                    const bridgeUrl = window.location.origin + window.location.pathname;
                    url.searchParams.set('bridgeUrl', bridgeUrl);
                    if (window.location.search) {
                        const params = new URLSearchParams(window.location.search);
                        for (const [key, value] of params.entries()) {
                            url.searchParams.set(key, value);
                        }
                    }
                    iframe.onload = () => { iframe.classList.add('loaded'); };
                    iframe.src = url.toString();
                } catch (e) {
                    console.error("Invalid iframe URL", e);
                }
            }
        });

        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'NAVIGATE') {
                const currentIframe = document.querySelector('iframe:not(.removing)');
                window.history.pushState(null, '', event.data.query);
                const baseUrl = "https://script.google.com/macros/s/AKfycbyz2VYabP6abyKzvu4mEIpeeMisN1VV4FNFqH7sCMhhDA1EldzS9sh7fWRiZKXvOVk5Vw/exec";
                const bridgeUrl = window.location.origin + window.location.pathname;
                const newIframe = document.createElement('iframe');
                newIframe.src = baseUrl + event.data.query + "&bridgeUrl=" + encodeURIComponent(bridgeUrl);
                newIframe.style.cssText = "position:absolute;top:env(safe-area-inset-top);left:0;right:0;bottom:0;border:none;display:block;opacity:0;transition:opacity 0.3s ease-in-out;z-index:10;";
                newIframe.onload = () => {
                    newIframe.classList.add('loaded');
                    if (currentIframe) {
                        currentIframe.classList.add('removing');
                        setTimeout(() => currentIframe.remove(), 300);
                    }
                };
                document.body.appendChild(newIframe);
            }
        });
    </script>
</body>

</html>
