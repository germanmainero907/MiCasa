<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Meta-tags para PWA en iOS y Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Presupuesto Casa</title>
    
    <style>
        /* Reseteo básico y aseguramiento del 100% de ocupación */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita barras de desplazamiento externas */
            background-color: #000; /* Fondo en caso de carga lenta */
        }
        
        /* Configuración del iframe para ocupar el 100% sin bordes */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <!-- 
      IMPORTANTE: Reemplaza la URL en el atributo src con la URL de tu web app publicada en Apps Script (la que termina en /exec).
      Ejemplo: src="https://script.google.com/macros/s/TU_ID_AQUI/exec" 
    -->
    <iframe src="https://script.google.com/macros/s/AKfycbyz2VYabP6abyKzvu4mEIpeeMisN1VV4FNFqH7sCMhhDA1EldzS9sh7fWRiZKXvOVk5Vw/exec" title="Presupuesto Casa App"></iframe>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const iframe = document.querySelector('iframe');
            if (iframe && window.location.search) {
                try {
                    const url = new URL(iframe.src);
                    const params = new URLSearchParams(window.location.search);
                    for (const [key, value] of params.entries()) {
                        url.searchParams.set(key, value);
                    }
                    iframe.src = url.toString();
                } catch (e) {
                    console.error("Invalid iframe URL", e);
                }
            }
        });

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'NAVIGATE') {
                window.location.search = event.data.query;
            }
        });
    </script>
</body>
</html>
