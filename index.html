<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Meta-tags para PWA en iOS y Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <title>Presupuesto Casa</title>

    <style>
        /* Reseteo básico y aseguramiento del 100% de ocupación */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* El color base por defecto de la aplicación (light) */
            background-color: #f8fafc;
        }

        /* Detectar si el dispositivo está en modo oscuro */
        @media (prefers-color-scheme: dark) {
            body {
                /* Color oscuro bg-slate-900 u otro, según Tailwind */
                background-color: #0f172a; 
            }
        }

        /* Configuración del iframe para ocupar el 100% sin bordes */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            opacity: 0;
            transition: opacity 0.15s ease-out;
            position: relative;
            z-index: 10;
        }
        
        iframe.loaded {
            opacity: 1;
        }

        /* Skeleton y Spinner central - se esconde cuando carga el iframe */
        #bridge-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .spinner-svg {
            width: 48px;
            height: 48px;
            color: #0ea5e9;
            animation: spin 1s linear infinite;
        }
        @media (prefers-color-scheme: dark) {
            .spinner-svg { color: #3b82f6; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="bridge-loader">
        <svg class="spinner-svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" style="opacity: 0.25;"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" style="opacity: 0.75;"></path>
        </svg>
    </div>
    <!-- 
      IMPORTANTE: Reemplaza la URL en el atributo src con la URL de tu web app publicada en Apps Script (la que termina en /exec).
      Ejemplo: src="https://script.google.com/macros/s/TU_ID_AQUI/exec" 
    -->
    <iframe
        src="https://script.google.com/macros/s/AKfycbyz2VYabP6abyKzvu4mEIpeeMisN1VV4FNFqH7sCMhhDA1EldzS9sh7fWRiZKXvOVk5Vw/exec"
        title="Presupuesto Casa App"
        onload="this.classList.add('loaded')"></iframe>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const iframe = document.querySelector('iframe');
            if (iframe) {
                try {
                    const url = new URL(iframe.src);

                    const bridgeUrl = window.location.origin + window.location.pathname;
                    url.searchParams.set('bridgeUrl', bridgeUrl);

                    if (window.location.search) {
                        const params = new URLSearchParams(window.location.search);
                        for (const [key, value] of params.entries()) {
                            url.searchParams.set(key, value);
                        }
                    }
                    
                    iframe.onload = () => {
                        iframe.classList.add('loaded');
                        document.getElementById('bridge-loader').style.display = 'none';
                        broadcastTheme();
                    };

                    iframe.src = url.toString();
                } catch (e) {
                    console.error("Invalid iframe URL", e);
                }
            }
            
            // Reaccionar a cambios ambientales
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', broadcastTheme);
        });
        
        function broadcastTheme() {
            const iframe = document.querySelector('iframe');
            if (iframe && iframe.contentWindow) {
                const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                iframe.contentWindow.postMessage({ type: 'THEME', theme: isDark ? 'dark' : 'light' }, '*');
            }
        }

        // Este listener intercepta la petición de navegación desde los iframes internos
        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'NAVIGATE') {
                const iframe = document.querySelector('iframe');
                const loader = document.getElementById('bridge-loader');
                
                // Actualizar la URL "fake" en el PWA sin disparar la recarga entera del navegador
                window.history.pushState(null, '', event.data.query);
                
                // Mostrar spinner y oscurecer iframe
                iframe.classList.remove('loaded');
                loader.style.display = 'flex';
                
                // Construir URL base del script asumiendo que el query trae los params correctos
                const baseUrl = "https://script.google.com/macros/s/AKfycbyz2VYabP6abyKzvu4mEIpeeMisN1VV4FNFqH7sCMhhDA1EldzS9sh7fWRiZKXvOVk5Vw/exec";
                const bridgeUrl = window.location.origin + window.location.pathname;
                
                // Forzar carga de nueva ruta
                iframe.src = baseUrl + event.data.query + "&bridgeUrl=" + encodeURIComponent(bridgeUrl);
            }
        });
    </script>
</body>

</html>
