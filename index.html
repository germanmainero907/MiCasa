<!DOCTYPE html>
<html lang="es" style="background-color: #0f172a; color-scheme: dark;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- Meta-tags para PWA en iOS y Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Casa">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <meta name="color-scheme" content="dark">
    <!-- PWA Icon from attached image -->
    <link rel="apple-touch-icon" href="icon.png">

    <title>Mi Casa App</title>

    <style>
        /* Reseteo básico y aseguramiento del 100% de ocupación */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Fondo oscuro para evitar barra blanca en iOS PWA */
            background-color: #0f172a;
            color-scheme: dark;
        }

        /* Iframe empieza debajo de la barra de estado */
        iframe {
            position: absolute;
            top: env(safe-area-inset-top);
            left: 0;
            width: 100%;
            height: calc(100% - env(safe-area-inset-top));
            border: none;
            display: block;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            z-index: 10;
        }

        iframe.loaded {
            opacity: 1;
        }
    </style>
</head>

<body>
    <iframe
        src="https://script.google.com/macros/s/AKfycbyz2VYabP6abyKzvu4mEIpeeMisN1VV4FNFqH7sCMhhDA1EldzS9sh7fWRiZKXvOVk5Vw/exec"
        title="Presupuesto Casa App"
        onload="this.classList.add('loaded')"></iframe>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const iframe = document.querySelector('iframe');
            if (iframe) {
                try {
                    const url = new URL(iframe.src);

                    const bridgeUrl = window.location.origin + window.location.pathname;
                    url.searchParams.set('bridgeUrl', bridgeUrl);

                    if (window.location.search) {
                        const params = new URLSearchParams(window.location.search);
                        for (const [key, value] of params.entries()) {
                            url.searchParams.set(key, value);
                        }
                    }
                    
                    iframe.onload = () => {
                        iframe.classList.add('loaded');
                    };

                    iframe.src = url.toString();
                } catch (e) {
                    console.error("Invalid iframe URL", e);
                }
            }
        });

        // Este listener intercepta la petición de navegación desde los iframes internos
        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'NAVIGATE') {
                const currentIframe = document.querySelector('iframe:not(.removing)');
                
                // Actualizar la URL "fake" en el PWA sin disparar la recarga entera del navegador
                window.history.pushState(null, '', event.data.query);
                
                // Construir URL base del script asumiendo que el query trae los params correctos
                const baseUrl = "https://script.google.com/macros/s/AKfycbyz2VYabP6abyKzvu4mEIpeeMisN1VV4FNFqH7sCMhhDA1EldzS9sh7fWRiZKXvOVk5Vw/exec";
                const bridgeUrl = window.location.origin + window.location.pathname;
                
                // Double iframe technique para evitar flash blanco
                const newIframe = document.createElement('iframe');
                newIframe.src = baseUrl + event.data.query + "&bridgeUrl=" + encodeURIComponent(bridgeUrl);
                
                newIframe.onload = () => {
                    newIframe.classList.add('loaded');
                    if (currentIframe) {
                        currentIframe.classList.add('removing');
                        setTimeout(() => currentIframe.remove(), 300);
                    }
                };
                
                document.body.appendChild(newIframe);
            }
        });
    </script>
</body>

</html>
