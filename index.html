<!DOCTYPE html>
<html lang="es" style="background-color: #080c14; color-scheme: dark;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- Meta-tags para PWA en iOS y Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Casa">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Mismo color de fondo de la app para que el panel superior / status bar sea uniforme -->
    <meta name="theme-color" content="#080c14">
    <meta name="color-scheme" content="dark">
    <!-- PWA Icon from attached image -->
    <link rel="apple-touch-icon" href="icon.png">

    <title>Mi Casa App</title>

    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            /* --app-h se calcula por JS con la altura REAL de la pantalla */
            --app-h: 100vh;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: var(--app-h);
            overflow: hidden;
            overscroll-behavior: none;
            background-color: #080c14;
            color-scheme: dark;
        }

        /* Barra de desplazamiento invisible en todos los navegadores */
        html, body, * {
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar,
        *::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            background: transparent !important;
        }

        /* Sonda invisible para leer los safe-area insets reales */
        #safeProbe {
            position: fixed;
            visibility: hidden;
            pointer-events: none;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Splash oscuro mientras arranca Apps Script (tapa el wrapper blanco de Google) */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: radial-gradient(circle at 50% 42%, #0f1b2e 0%, #080c14 60%);
            transition: opacity 0.35s ease;
        }

        #splash.hide {
            opacity: 0;
            pointer-events: none;
        }

        .splash-logo {
            width: 72px;
            height: 72px;
            border-radius: 24px;
            padding: 2px;
            background: linear-gradient(45deg, #0284c7, #22d3ee);
            box-shadow: 0 0 40px -6px rgba(14, 165, 233, 0.6);
            animation: pulse 1.6s ease-in-out infinite;
        }

        .splash-logo div {
            width: 100%;
            height: 100%;
            border-radius: 22px;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        .splash-bar {
            width: 120px;
            height: 3px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .splash-bar span {
            display: block;
            width: 40%;
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, #0ea5e9, #10b981);
            animation: slide 1.1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        @keyframes slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(260%); }
        }

        /* Barra de progreso sutil entre pantallas */
        #navProgress {
            position: fixed;
            top: var(--sat);
            left: 0;
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg, #0ea5e9, #38bdf8, #10b981);
            z-index: 999;
            opacity: 0;
            transition: width 0.35s ease, opacity 0.2s ease;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }

        /* El iframe va desde debajo de la status bar hasta el borde FISICO inferior */
        iframe {
            position: absolute;
            top: var(--sat);
            left: 0;
            width: 100%;
            height: calc(var(--app-h) - var(--sat));
            border: none;
            display: block;
            background-color: #080c14;
            color-scheme: dark;
            transition: opacity 0.25s ease-in-out;
        }

        iframe.active-frame {
            z-index: 20;
            opacity: 1;
        }

        /* Carga por detras, invisible hasta que la pantalla avisa PAGE_READY */
        iframe.incoming-frame {
            z-index: 10;
            opacity: 0;
        }

        iframe.removing {
            opacity: 0;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>

<body>
    <div id="safeProbe"></div>

    <div id="splash">
        <div class="splash-logo"><div>🏠</div></div>
        <div class="splash-bar"><span></span></div>
    </div>

    <div id="navProgress"></div>

    <script>
        const BASE_URL = "https://script.google.com/macros/s/AKfycbyz2VYabP6abyKzvu4mEIpeeMisN1VV4FNFqH7sCMhhDA1EldzS9sh7fWRiZKXvOVk5Vw/exec";
        const root = document.documentElement;
        const probe = document.getElementById('safeProbe');
        const splash = document.getElementById('splash');
        const progressBar = document.getElementById('navProgress');

        // ---------- Altura real visible ----------
        // Una sonda position:fixed top:0 bottom:0 mide exactamente el area que iOS deja pintar.
        // (Forzar screen.height empujaba el iframe por debajo del borde visible y cortaba la barra.)
        const vpProbe = document.createElement('div');
        vpProbe.style.cssText = 'position:fixed;top:0;bottom:0;left:0;width:0;visibility:hidden;pointer-events:none;';
        document.body.appendChild(vpProbe);

        function visibleHeight() {
            return Math.round(vpProbe.getBoundingClientRect().height) || window.innerHeight;
        }

        function physicalHeight() {
            const standalone = window.navigator.standalone ||
                window.matchMedia('(display-mode: standalone)').matches;
            if (!standalone) return visibleHeight();
            const portrait = window.matchMedia('(orientation: portrait)').matches;
            return portrait
                ? Math.max(screen.width, screen.height)
                : Math.min(screen.width, screen.height);
        }

        function computeAppHeight() {
            root.style.setProperty('--app-h', visibleHeight() + 'px');
        }

        function getSafeArea() {
            const cs = getComputedStyle(probe);
            const top = parseFloat(cs.paddingTop) || 0;
            const rawBottom = parseFloat(cs.paddingBottom) || 0;
            // Garantizar al menos 20px para que los textos nunca queden tapados por la barra de inicio
            return { top, bottom: Math.max(rawBottom, 20) };
        }

        computeAppHeight();
        window.addEventListener('resize', computeAppHeight);
        window.addEventListener('orientationchange', () => setTimeout(computeAppHeight, 250));

        // ---------- Progreso ----------
        function startProgress() {
            progressBar.style.opacity = '1';
            progressBar.style.width = '65%';
        }

        function finishProgress() {
            progressBar.style.width = '100%';
            setTimeout(() => {
                progressBar.style.opacity = '0';
                setTimeout(() => { progressBar.style.width = '0%'; }, 200);
            }, 150);
        }

        // ---------- Carga de frames sin flash blanco ----------
        // El frame nuevo carga invisible por detras. Se muestra solo cuando
        // la pantalla avisa PAGE_READY (o por fallback si no avisa).
        let pendingFrame = null;
        let pendingReveal = null;

        function loadFrame(src, isInitial) {
            const currentIframe = document.querySelector('iframe.active-frame');

            const frame = document.createElement('iframe');
            frame.className = 'incoming-frame';
            frame.title = 'Presupuesto Casa App';
            frame.setAttribute('allowtransparency', 'true');
            frame.src = src;

            let revealed = false;
            const reveal = () => {
                if (revealed) return;
                revealed = true;
                if (pendingFrame === frame) { pendingFrame = null; pendingReveal = null; }
                if (!isInitial) finishProgress();

                setTimeout(() => {
                    frame.classList.remove('incoming-frame');
                    frame.classList.add('active-frame');
                    if (isInitial) splash.classList.add('hide');

                    if (currentIframe && currentIframe !== frame) {
                        currentIframe.classList.add('removing');
                        setTimeout(() => currentIframe.remove(), 300);
                    }
                }, 80);
            };

            pendingFrame = frame;
            pendingReveal = reveal;

            // Fallback: onload del wrapper de Google llega ANTES de que pinte nuestro contenido,
            // por eso se espera bastante mas si la pantalla no manda PAGE_READY.
            frame.onload = () => setTimeout(reveal, isInitial ? 2500 : 900);

            document.body.appendChild(frame);
        }

        function buildInitialSrc() {
            const url = new URL(BASE_URL);
            url.searchParams.set('bridgeUrl', window.location.origin + window.location.pathname);
            const params = new URLSearchParams(window.location.search);
            for (const [key, value] of params.entries()) url.searchParams.set(key, value);
            if (!url.searchParams.has('page')) url.searchParams.set('page', 'IndexMockup');
            return url.toString();
        }

        loadFrame(buildInitialSrc(), true);

        // ---------- Mensajes desde las pantallas ----------
        window.addEventListener('message', function (event) {
            const data = event.data;
            if (!data || !data.type) return;

            if (data.type === 'GET_SAFE_AREA') {
                // env() vale 0 dentro del iframe: le mandamos los valores reales
                const sa = getSafeArea();
                try { event.source.postMessage({ type: 'SAFE_AREA', top: sa.top, bottom: sa.bottom }, '*'); } catch (_) {}
                return;
            }

            if (data.type === 'PAGE_READY') {
                if (pendingReveal) pendingReveal();
                return;
            }

            if (data.type === 'NAVIGATE') {
                window.history.pushState(null, '', data.query);
                startProgress();
                const bridgeUrl = window.location.origin + window.location.pathname;
                loadFrame(BASE_URL + data.query + "&bridgeUrl=" + encodeURIComponent(bridgeUrl), false);
            }
        });
    </script>
</body>

</html>
