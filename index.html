<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Meta-tags para PWA en iOS y Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <title>Presupuesto Casa</title>

    <style>
        /* Reseteo básico y aseguramiento del 100% de ocupación */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* El color base por defecto de la aplicación (light) */
            background-color: #f8fafc;
        }

        /* Detectar si el dispositivo está en modo oscuro */
        @media (prefers-color-scheme: dark) {
            body {
                /* Color oscuro bg-slate-900 u otro, según Tailwind */
                background-color: #0f172a; 
            }
        }

        /* Configuración del iframe para ocupar el 100% sin bordes */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            opacity: 0;
            transition: opacity 0.5s ease-in;
            position: relative;
            z-index: 10;
        }
        
        iframe.loaded {
            opacity: 1;
        }

        /* Skeleton y Spinner central - se esconde cuando carga el iframe */
        #bridge-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(14, 165, 233, 0.2);
            border-top: 4px solid #0ea5e9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="bridge-loader">
        <div class="spinner"></div>
    </div>
    <!-- 
      IMPORTANTE: Reemplaza la URL en el atributo src con la URL de tu web app publicada en Apps Script (la que termina en /exec).
      Ejemplo: src="https://script.google.com/macros/s/TU_ID_AQUI/exec" 
    -->
    <iframe
        src="https://script.google.com/macros/s/AKfycbyz2VYabP6abyKzvu4mEIpeeMisN1VV4FNFqH7sCMhhDA1EldzS9sh7fWRiZKXvOVk5Vw/exec"
        title="Presupuesto Casa App"
        onload="this.classList.add('loaded')"></iframe>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const iframe = document.querySelector('iframe');
            if (iframe) {
                try {
                    const url = new URL(iframe.src);

                    // Pasar la URL actual de GitHub al generador de Apps Script
                    const bridgeUrl = window.location.origin + window.location.pathname;
                    url.searchParams.set('bridgeUrl', bridgeUrl);

                    if (window.location.search) {
                        const params = new URLSearchParams(window.location.search);
                        for (const [key, value] of params.entries()) {
                            url.searchParams.set(key, value);
                        }
                    }
                    iframe.src = url.toString();
                } catch (e) {
                    console.error("Invalid iframe URL", e);
                }
            }
        });

        // Este listener ya no es el canal principal ya que se hará top.location.href, pero se deja por seguridad
        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'NAVIGATE') {
                window.location.search = event.data.query;
            }
        });
    </script>
</body>

</html>
